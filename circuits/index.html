<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회로 · 물리 아틀라스</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../atlas.css">
<link rel="stylesheet" href="../engine/book.css">
<link rel="expect" href="#right" blocking="render">
<script src="../engine/cover.js"></script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/" } }
</script>
</head>
<body class="book-body">
  <header class="topbar">
    <a href="../" class="brand">물리 아틀라스</a>
    <span class="crumb">No. 13 · 회로</span>
    <nav class="dots" id="dots" aria-label="페이지"></nav>
  </header>

  <div class="scroll-space" id="space"></div>

  <main class="book" id="book">
    <section class="page left" id="left" aria-live="polite">
      <article class="sheet" id="sheet"></article>
      <article class="plate" id="plate" hidden></article>
      <footer class="folio"><span>회로</span><span id="folio">1</span></footer>
    </section>

    <section class="page right" id="right">
      <div class="figure">
        <canvas id="gl" aria-label="인터랙티브 그림: 도선과 간단한 회로. 장면 위에 마우스를 올리고 클릭하면 분해된다."></canvas>
        <div id="labels" aria-hidden="true"></div>
        <div class="corner tl" id="figno">그림 1</div>
        <div class="corner tr" id="figtitle"></div>
        <div class="corner bl" id="hint">드래그해 회전 · Shift+드래그로 이동 · 클릭해 분해</div>
        <div class="corner br readout" id="readout"></div>
      </div>
    </section>

    <div class="leaf" id="leaf" aria-hidden="true">
      <div class="leaf-front"><span id="leafnext"></span></div>
      <div class="leaf-back"><article class="sheet" id="leafsheet"></article></div>
    </div>
    <div class="spine" aria-hidden="true"></div>
  </main>

  <p class="scroll-cue" id="cue">스크롤해 페이지 넘기기</p>
  <script type="module" src="main.js"></script>
</body>
</html>
