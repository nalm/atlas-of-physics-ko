<style>
  /* chapter 5: blue is the total momentum of a system */
  .lbl.vec.blue { color: #2a5f9e; }
  .chart .total { fill: none; stroke: #3d7fcf; stroke-width: 1.8; }
  .chart .lab.blue { fill: #2a5f9e; }

  .chart .area { fill: #ecece8; stroke: none; }
  .chart .vk { stroke: var(--hi); stroke-width: 2; } .chart .vkh { fill: var(--hi); }
